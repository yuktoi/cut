<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Perfect Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;height:100dvh;background:#000;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    font-family:'Orbitron','Courier New',monospace;color:#fff;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}
  .overlay{
    position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;
    background:radial-gradient(ellipse at center,rgba(20,0,35,.55) 0%,rgba(0,0,0,.82) 70%);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    transition:opacity .35s ease;
    padding:
      max(8px, env(safe-area-inset-top, 0px))
      max(12px, env(safe-area-inset-right, 0px))
      max(8px, env(safe-area-inset-bottom, 0px))
      max(12px, env(safe-area-inset-left, 0px));
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay.locked button{pointer-events:none}
  .title{
    font-size:clamp(32px,8.5vw,72px);font-weight:900;letter-spacing:.06em;line-height:1;
    color:#fff;text-shadow:0 0 6px #ff0055,0 0 22px #ff0055,0 0 48px #ff0055;
  }
  .title span{color:#00f0ff;text-shadow:0 0 6px #00f0ff,0 0 22px #00f0ff,0 0 48px #00f0ff}
  .sub{font-size:11px;letter-spacing:.45em;opacity:.6;padding-left:.45em}
  .big{
    font-size:clamp(48px,13vw,96px);font-weight:900;line-height:1;
    text-shadow:0 0 10px #00f0ff,0 0 34px #00f0ff,0 0 70px rgba(0,240,255,.6);
  }
  .tier{
    font-weight:900;letter-spacing:.12em;line-height:1.15;
    font-size:clamp(16px,4.4vw,28px);margin-top:2px;
  }
  .tier.god{
    color:#FFD700;
    text-shadow:0 0 8px #FFD700,0 0 18px rgba(255,215,0,.45);
    animation:glow-gold 2.8s ease-in-out infinite alternate;
  }
  .tier.slicer{color:#00f0ff;text-shadow:0 0 6px #00f0ff,0 0 16px rgba(0,240,255,.45)}
  .tier.human{color:#888;text-shadow:none}
  .tier.butcher{color:#39FF14;text-shadow:0 0 8px rgba(57,255,20,.4)}
  @keyframes glow-gold{
    from{text-shadow:0 0 6px #FFD700,0 0 14px rgba(255,215,0,.35)}
    to{text-shadow:0 0 10px #FFD700,0 0 22px rgba(255,215,0,.55)}
  }
  #glitch{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;overflow:hidden;
  }
  body.gfx #glitch{opacity:1}
  #glitch .band{
    position:absolute;left:0;right:0;height:6px;opacity:0;
    background:linear-gradient(90deg,rgba(255,0,85,.0) 0%,rgba(255,0,85,.45) 46%,rgba(0,240,255,.45) 54%,rgba(0,240,255,0) 100%);
    mix-blend-mode:screen;
  }
  #glitch .b1{top:38%}
  #glitch .b2{top:52%;height:4px}
  #glitch .b3{top:61%;height:5px}
  body.gfx #glitch .b1{animation:slice-a .2s cubic-bezier(0.25,0.46,0.45,0.94) both}
  body.gfx #glitch .b2{animation:slice-b .2s step-end both}
  body.gfx #glitch .b3{animation:slice-a .2s cubic-bezier(0.25,0.46,0.45,0.94) both}
  @keyframes slice-a{
    0%{transform:translateX(0);clip-path:inset(0);opacity:0}
    22%{transform:translateX(-5px);clip-path:inset(0 1.5% 0 0);opacity:.9}
    58%{transform:translateX(4px);clip-path:inset(0 0 0 2%);opacity:.45}
    100%{transform:translateX(0);clip-path:inset(0);opacity:0}
  }
  @keyframes slice-b{
    0%{transform:translateX(0);opacity:0}
    35%{transform:translateX(5px);clip-path:inset(0 0 0 4%);opacity:.8}
    70%{transform:translateX(-3px);opacity:.3}
    100%{transform:translateX(0);opacity:0}
  }
  #static{
    position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;
    background:repeating-linear-gradient(to bottom,transparent 0 6px,rgba(0,240,255,.22) 6px 7px);
    mix-blend-mode:screen;
  }
  #static.on{animation:track-lines .4s cubic-bezier(0.25,0.46,0.45,0.94) forwards}
  @keyframes track-lines{
    0%{opacity:0;transform:translateX(0)}
    20%{opacity:.62;transform:translateX(-5px)}
    55%{opacity:.28;transform:translateX(3px)}
    100%{opacity:0;transform:translateX(0)}
  }
  #over.boot{animation:result-in .4s cubic-bezier(0.25,0.46,0.45,0.94) both}
  @keyframes result-in{
    0%{transform:translateY(8px)}
    100%{transform:none}
  }
  .err{font-size:13px;letter-spacing:.25em;color:#ff0055;text-shadow:0 0 10px #ff0055}
  .best{font-size:13px;letter-spacing:.35em;opacity:.8}
  .best b{color:#ffd700;text-shadow:0 0 10px #ffd700}
  .tag{
    font-size:11px;font-weight:900;letter-spacing:.35em;padding:6px 12px 6px 16px;
    color:#000;background:#ffd700;border-radius:999px;box-shadow:0 0 16px #ffd700;
    animation:pulse 1s ease-in-out infinite alternate;
  }
  .tag.hidden{display:none}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
  button{
    margin-top:10px;font-family:inherit;font-weight:900;font-size:15px;letter-spacing:.35em;
    padding:17px 40px 17px 46px;color:#000;background:#00f0ff;border:0;border-radius:999px;
    cursor:pointer;outline:none;
    box-shadow:0 0 14px #00f0ff,0 0 44px rgba(0,240,255,.55);
    transition:transform .12s ease,box-shadow .2s ease;
  }
  button:hover{box-shadow:0 0 20px #00f0ff,0 0 70px rgba(0,240,255,.8)}
  button:active{transform:scale(.93)}
  #hudToggles{
    position:fixed;z-index:40;
    top:calc(8px + env(safe-area-inset-top, 0px));
    right:calc(8px + env(safe-area-inset-right, 0px));
    display:flex;gap:8px;align-items:center;
  }
  .hud-btn{
    margin:0;padding:6px;width:auto;height:auto;
    display:grid;place-items:center;
    color:#00f0ff;background:transparent;border:0;border-radius:0;
    box-shadow:none;touch-action:manipulation;letter-spacing:0;
  }
  .hud-btn:hover,.hud-btn:active{background:transparent;box-shadow:none;transform:none}
  .hud-btn svg{width:22px;height:22px;display:block;filter:drop-shadow(0 0 4px currentColor)}
  .hud-btn .ico-off{display:none}
  .hud-btn[aria-pressed="false"]{color:#ff0055;border:0;box-shadow:none}
  .hud-btn[aria-pressed="false"] .ico-on{display:none}
  .hud-btn[aria-pressed="false"] .ico-off{display:block}
  #safe{
    position:fixed;pointer-events:none;visibility:hidden;
    top:env(safe-area-inset-top, 0px);right:env(safe-area-inset-right, 0px);
    bottom:env(safe-area-inset-bottom, 0px);left:env(safe-area-inset-left, 0px);
  }
  #over{
    justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    padding:
      calc(env(safe-area-inset-top, 0px) + 48px)
      max(16px, env(safe-area-inset-right, 0px))
      max(18px, env(safe-area-inset-bottom, 0px))
      max(16px, env(safe-area-inset-left, 0px));
    gap:8px;
  }
  .max{font-size:12px;letter-spacing:.32em;opacity:.6}
  .best{font-size:12px;letter-spacing:.28em;opacity:.75}
  #lbForm{display:flex;gap:8px;width:min(440px,94vw);margin-top:4px}
  #nick{
    flex:1;min-width:0;font-family:inherit;font-weight:700;font-size:16px;letter-spacing:.18em;
    color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(0,240,255,.6);border-radius:999px;
    padding:14px 16px;outline:none;text-transform:uppercase;
    box-shadow:0 0 12px rgba(0,240,255,.25);user-select:text;-webkit-user-select:text;
  }
  #nick::placeholder{color:rgba(255,255,255,.35);letter-spacing:.22em}
  #nick:focus{border-color:#00f0ff;box-shadow:0 0 16px #00f0ff}
  #lbForm button,#restart{margin-top:0;padding:16px 22px 16px 26px;font-size:13px}
  .formErr{min-height:14px;font-size:10px;letter-spacing:.18em;color:#ff0055;text-shadow:0 0 8px #ff0055}
  .gone{display:none !important}
  .board{
    width:min(440px,94vw);border:1px solid rgba(0,240,255,.55);border-radius:2px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,0,85,.35),0 0 22px rgba(0,240,255,.18);
    background:
      repeating-linear-gradient(0deg,rgba(0,240,255,.05) 0 1px,transparent 1px 4px),
      #020607;
    font-family:'Courier New',monospace;text-align:left;
  }
  .lbTitle{margin:8px 0 0;font-size:11px;letter-spacing:.28em;color:#c8fff4;text-shadow:0 0 10px #00f0ff}
  .lbTitle::before{content:'> ';color:#39FF14;text-shadow:0 0 8px #39FF14}
  .lbTitle::after{content:'_';color:#00f0ff;animation:caret 1s steps(1,end) infinite}
  @keyframes caret{50%{opacity:0}}
  .head,.row{
    display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;
    padding:7px 12px;font-size:12px;letter-spacing:.06em;
  }
  .head{font-size:10px;letter-spacing:.2em;color:#00f0ff;opacity:.7;border-bottom:1px solid rgba(0,240,255,.28)}
  .row:nth-child(even){background:rgba(0,240,255,.035)}
  .rk{color:#39FF14;text-shadow:0 0 8px rgba(57,255,20,.7)}
  .rk::before{content:'>';margin-right:5px}
  .sc{font-weight:900;color:#e8fff4}
  .who{display:inline-flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
  .who.god{color:#FFD700;text-shadow:0 0 8px #FFD700}
  .who.slicer{color:#00f0ff;text-shadow:0 0 8px #00f0ff}
  .badge{
    font-size:8px;letter-spacing:.12em;padding:1px 5px 2px;border:1px solid currentColor;line-height:1.4;
  }
  .dim{opacity:.28}
  .row.me{background:rgba(0,240,255,.1);box-shadow:inset 3px 0 #00f0ff,0 0 14px rgba(0,240,255,.2);font-weight:900}
  .row.me .sc{color:#fff;text-shadow:0 0 8px #00f0ff}
  .outside{font-size:11px;letter-spacing:.16em;opacity:.8;margin-top:6px}
  .outside b{color:#00f0ff;text-shadow:0 0 8px #00f0ff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe" aria-hidden="true"></div>
<div id="hudToggles">
  <button type="button" id="sound" class="hud-btn" aria-pressed="true" aria-label="Sound on">
    <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M4 9v6h3.5L13 19.5v-15L7.5 9H4z"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.2 8.6a4.2 4.2 0 0 1 0 6.8M18.8 6.2a7.6 7.6 0 0 1 0 11.6"/>
    </svg>
    <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M4 9v6h3.5L13 19.5v-15L7.5 9H4z"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>
  <button type="button" id="vib" class="hud-btn" aria-pressed="true" aria-label="Vibration on">
    <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="8" y="3" width="8" height="18" rx="1.6" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 8.5v7M2.5 10.5v3M19 8.5v7M21.5 10.5v3"/>
    </svg>
    <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="8" y="3" width="8" height="18" rx="1.6" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 5l14 14"/>
    </svg>
  </button>
</div>
<div id="glitch" aria-hidden="true"><span class="band b1"></span><span class="band b2"></span><span class="band b3"></span></div>
<div id="static" aria-hidden="true"></div>

<div id="menu" class="overlay">
  <div class="title">PERFECT <span>CUT</span></div>
  <div class="sub">10 ROUNDS · TOP SCORE</div>
  <button id="play">PLAY</button>
</div>

<div id="over" class="overlay hidden">
  <div class="sub">RESULT</div>
  <div class="tier human" id="ovTier">[ NORMAL HUMAN ]</div>
  <div class="big" id="ovScore">0</div>
  <div class="max" id="ovMax">/ 12,000</div>
  <div class="best">BEST <b id="ovBest">0</b></div>
  <div class="tag hidden" id="ovNew">NEW BEST</div>
  <form id="lbForm">
    <input id="nick" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NICKNAME" enterkeyhint="done" aria-label="Nickname">
    <button type="submit" id="save">SAVE</button>
  </form>
  <div class="formErr" id="formErr"></div>
  <div id="boardWrap" class="gone">
    <div class="lbTitle">GLOBAL TOP 10</div>
    <div class="board" id="board"></div>
    <div class="outside gone" id="outside"></div>
  </div>
  <button type="button" id="restart">RESTART</button>
</div>

<script>
(() => {
'use strict';

// ---------- Tuning ----------
const PERFECT_ERR = 0.10;   // % error treated as PERFECT
const SUCCESS_ERR = 1.0;    // % error for the gold SUCCESS juice
const ROUGH_ERR   = 3.0;    // % error above this keeps the rough-cut juice, but the run continues
const ROUNDS = 10;
const PERFECT_BONUS = 200;
const ROUND_CAP = 1000 + PERFECT_BONUS; // 1,200 at 0.00% error
const MAX_SCORE = ROUNDS * ROUND_CAP;   // 12,000
const RESULT_TIME = 1.5;    // pause so the round score can be read
const PINK = '#ff0055', BLUE = '#00f0ff', GOLD = '#ffd700', LASER = '#ffe600';
const FONT = "'Orbitron','Courier New',monospace";
const BEST_KEY = 'perfectcut_best_v1';
const LB_KEY = 'perfectcut_leaderboard_v1';
const LB_ENDPOINT = '/api/leaderboard';

// ---------- Canvas ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, R = 100, CX = 0, CY = 0;
let L = {};           // layout
let bgGlow, vignette;

let SAFE = { top: 0, right: 0, bottom: 0, left: 0 };
let chrome = { scoreLabel: 26, scoreValue: 54, roundLabel: 26, roundValue: 50, clear: 78, scoreX: 18 };
function readSafe() {
  const el = document.getElementById('safe');
  if (!el) return;
  const r = el.getBoundingClientRect();
  SAFE = {
    top: r.top,
    left: r.left,
    right: Math.max(0, window.innerWidth - r.right),
    bottom: Math.max(0, window.innerHeight - r.bottom)
  };
}
function layoutChrome() {
  const hud = document.getElementById('hudToggles');
  const box = hud ? hud.getBoundingClientRect() : { bottom: SAFE.top };
  const scoreLabel = Math.max(26, SAFE.top + 16, box.bottom + 20);
  const scoreValue = scoreLabel + 28;
  const roundLabel = scoreLabel;
  const roundValue = roundLabel + 24;
  chrome = {
    scoreLabel, scoreValue, roundLabel, roundValue,
    clear: Math.max(scoreValue + 18, roundValue + 16),
    scoreX: Math.max(18, W * 0.04, SAFE.left + 12)
  };
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  readSafe();
  layoutChrome();

  const s = Math.min(W * 0.11, H * 0.085, 56);
  const tLabelY = Math.max(64, H * 0.1, chrome.clear);
  const tY = tLabelY + s * 0.95;
  const rSize = s * 0.5;
  const rY = tY + s * 0.95;
  const eY = rY + rSize * 1.25;
  const top = eY + rSize * 0.9 + 10;
  const bottom = H - Math.max(34, H * 0.06, SAFE.bottom + 28);
  CX = W / 2;
  CY = (top + bottom) / 2;
  R = Math.max(40, Math.min(W * 0.4, (bottom - top) / 2, 300));
  L = { s, tLabelY, tY, rSize, rY, eY, pop: Math.min(W * 0.13, 76) };

  bgGlow = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.7);
  bgGlow.addColorStop(0, 'rgba(110,0,160,0.28)');
  bgGlow.addColorStop(0.5, 'rgba(60,0,90,0.10)');
  bgGlow.addColorStop(1, 'rgba(0,0,0,0)');
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.85)');
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutChrome);

// ---------- Utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
let vibOn = true;
function vibrate(p) {
  if (!vibOn) return;
  try { navigator.vibrate && navigator.vibrate(p); } catch (e) {}
}
function syncVibButton() {
  const btn = document.getElementById('vib');
  if (!btn) return;
  btn.setAttribute('aria-pressed', vibOn ? 'true' : 'false');
  btn.setAttribute('aria-label', vibOn ? 'Vibration on' : 'Vibration off');
}
function toggleVib() {
  vibOn = !vibOn;
  if (!vibOn) { try { navigator.vibrate && navigator.vibrate(0); } catch (e) {} }
  syncVibButton();
  if (vibOn) { try { navigator.vibrate && navigator.vibrate(20); } catch (e) {} }
}
function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
// RoundScore = max(0, 1000 - floor(error% * 200)); PERFECT adds +200 (1,200 at 0.00%).
function scoreFor(err) {
  const base = Math.max(0, 1000 - Math.floor(err * 200));
  const perfect = err <= PERFECT_ERR;
  return { pts: perfect ? base + PERFECT_BONUS : base, perfect };
}
function tierFor(score) {
  if (score >= 11000) return { id: 'god', label: '[ GOD HAND ]' };
  if (score >= 9000) return { id: 'slicer', label: '[ CYBER SLICER ]' };
  if (score >= 6000) return { id: 'human', label: '[ NORMAL HUMAN ]' };
  return { id: 'butcher', label: '[ BUTCHER ]' };
}

// ---------- Geometry ----------
// Hot-path polygons live in preallocated [x, y] pair buffers with an explicit vertex count `n`,
// so per-frame and per-cut geometry never allocates. Buffers only grow past POLY_PREALLOC.
const POLY_PREALLOC = 136;  // largest generated shape (128) + 2 clip intersections, with headroom
const SHAPE_EPS = 0.0025;   // outline tolerance in unit radii: ≤0.75 px at the 300 px max radius
const GHOST_EPS = 1.5;      // coarser px tolerance for the faint trail ghosts
function pairBuffer(n) {
  const buf = new Array(n);
  for (let i = 0; i < n; i++) buf[i] = [0, 0];
  return buf;
}
function polyArea(p, n = p.length) {
  let a = 0;
  for (let i = 0, j = n - 1; i < n; j = i++) a += p[j][0] * p[i][1] - p[i][0] * p[j][1];
  return a / 2;
}
function centroid(p, n = p.length, out = [0, 0]) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const f = p[j][0] * p[i][1] - p[i][0] * p[j][1];
    a += f; cx += (p[j][0] + p[i][0]) * f; cy += (p[j][1] + p[i][1]) * f;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-9) {
    let sx = 0, sy = 0; for (let i = 0; i < n; i++) { sx += p[i][0]; sy += p[i][1]; }
    out[0] = sx / n; out[1] = sy / n;
    return out;
  }
  out[0] = cx / (6 * a); out[1] = cy / (6 * a);
  return out;
}
// Sutherland–Hodgman against one half-plane; area stays exact for concave shapes.
// Writes into `out` (a pair buffer) and returns the vertex count.
function clipHalf(p, pn, a, b, sign, out) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  let m = 0;

// ---------- Shapes ----------
function genShapePoints(level) {
  const pool =
    level < 2  ? ['circle', 'rect', 'tri'] :
    level < 6  ? ['circle', 'rect', 'tri', 'ngon', 'ellipse', 'blob', 'semi'] :

  const type = pick(pool);
  let p = [];
  const TAU = Math.PI * 2;
  switch (type) {
    case 'circle':
      for (let i = 0; i < 128; i++) { const t = i / 128 * TAU; p.push([Math.cos(t), Math.sin(t)]); }
      break;
    case 'ellipse': {
      const b = rand(0.45, 0.8);
      for (let i = 0; i < 128; i++) { const t = i / 128 * TAU; p.push([Math.cos(t), Math.sin(t) * b]); }
      break;
    }
    case 'rect': {
      const h = rand(0.45, 1);
      p = [[-1, -h], [1, -h], [1, h], [-1, h]];
      break;
    }
    case 'tri':
      for (let i = 0; i < 3; i++) {
        const t = i / 3 * TAU + rand(-0.45, 0.45);
        const r = rand(0.7, 1);
        p.push([Math.cos(t) * r, Math.sin(t) * r]);
      }
      break;
    case 'ngon': {
      const n = randInt(5, 8);
      for (let i = 0; i < n; i++) { const t = i / n * TAU; p.push([Math.cos(t), Math.sin(t)]); }
      break;
    }
    case 'star': {
      const n = randInt(5, 7), inner = rand(0.45, 0.62);
      for (let i = 0; i < n * 2; i++) {
        const t = i / (n * 2) * TAU, r = i % 2 ? inner : 1;
        p.push([Math.cos(t) * r, Math.sin(t) * r]);
      }
      break;
    }
    case 'blob': {
      const n = randInt(9, 15);
      for (let i = 0; i < n; i++) {
        const t = (i + rand(-0.3, 0.3)) / n * TAU;
        const r = rand(0.55, 1);
        p.push([Math.cos(t) * r, Math.sin(t) * r]);
      }
      break;
    }
    case 'heart':
      for (let i = 0; i < 120; i++) {
        const t = i / 120 * TAU;
        p.push([16 * Math.pow(Math.sin(t), 3) / 17,
          -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17]);
      }
      break;
    case 'cross': {
      const a = rand(0.3, 0.45);
      p = [[-a, -1], [a, -1], [a, -a], [1, -a], [1, a], [a, a], [a, 1], [-a, 1], [-a, a], [-1, a], [-1, -a], [-a, -a]];
      break;
    }
    case 'lshape': {
      const t = rand(0.35, 0.55);
      p = [[0, 0], [t, 0], [t, 1 - t], [1, 1 - t], [1, 1], [0, 1]];
      break;
    }
    case 'semi':
      for (let i = 0; i <= 64; i++) { const t = Math.PI * i / 64; p.push([Math.cos(t), -Math.sin(t)]); }
      break;
    case 'trap': {
      const top = rand(0.2, 0.7), h = rand(0.5, 0.9), sk = rand(-0.3, 0.3);
      p = [[-1, h], [1, h], [top + sk, -h], [-top + sk, -h]];

}

function makeShape(level, demo) {

// Appintos leaderboard bridge. localStorage is used when the network or the platform bridge fails.
async function submitScoreToLeaderboard(nickname, score) {
  const points = Math.max(0, Math.round(Number(score) || 0));
  const entry = {
    nickname: String(nickname).slice(0, 8),
    score: points,
    tier: tierFor(points).id,
    at: Date.now()
  };
  const payload = { game: 'perfect-cut', ...entry };
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 2500);
    let data = null;
    try {
      const res = await fetch(LB_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('bridge');
      data = await res.json();
    } finally {
      clearTimeout(timer);
    }
    const remote = Array.isArray(data && data.board)
      ? data.board.filter(e => e && typeof e.nickname === 'string' && Number.isFinite(Number(e.score))).slice(0, 10).map(e => ({
          nickname: String(e.nickname).slice(0, 8),
          score: Math.round(Number(e.score)),
          tier: typeof e.tier === 'string' ? e.tier : tierFor(Math.round(Number(e.score))).id,
          at: Number.isFinite(Number(e.at)) ? Number(e.at) : null
        }))
      : null;
    if (!remote) throw new Error('bridge');
    const mine = remote.find(e => e.at === entry.at)
      || remote.find(e => e.nickname === entry.nickname && Number(e.score) === entry.score);
    if (mine && mine.at == null) mine.at = entry.at;
    try { localStorage.setItem(LB_KEY, JSON.stringify(remote)); } catch (e) {}
    return { ok: true, source: 'network', entry, board: remote };
  } catch (e) {
    let board = readBoard();
    board.push(entry);
    board.sort((a, b) => b.score - a.score || a.at - b.at);
    board = board.slice(0, 10);
    try { localStorage.setItem(LB_KEY, JSON.stringify(board)); } catch (err) {}
    return { ok: true, source: 'localStorage', entry, board };
  }
}

  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (len < 18) return;
  const pn = worldPts(shape);
  const s1 = PiecePhysics.pool[0], s2 = PiecePhysics.pool[1];
  s1.n = clipHalf(WORLD, pn, a, b, 1, s1.pts);
  s2.n = clipHalf(WORLD, pn, a, b, -1, s2.pts);
  const A1 = s1.n >= 3 ? Math.abs(polyArea(s1.pts, s1.n)) : 0;
  const A2 = s2.n >= 3 ? Math.abs(polyArea(s2.pts, s2.n)) : 0;
  const tot = A1 + A2;
  if (tot <= 0 || A1 / tot < 0.002 || A2 / tot < 0.002) {
    sfx.miss();
    addPop('MISS', CX, CY, L.pop * 0.45, 'rgba(255,255,255,0.7)', 0.6);
    return;
  }

  const p1 = A1 / tot * 100;
  const smallRaw = Math.min(p1, 100 - p1);
  const small = Math.round(smallRaw * 100) / 100;
  const large = (10000 - Math.round(small * 100)) / 100;
  const err = Math.abs(smallRaw - target);

  const firstIsSmall = p1 <= 50;
  const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;
  cutN[0] = -uy; cutN[1] = ux;
  centroid(s1.pts, s1.n, s1.c);
  s1.dir = 1;  s1.col = firstIsSmall ? PINK : BLUE; s1.pct = firstIsSmall ? small : large;
  centroid(s2.pts, s2.n, s2.c);
  s2.dir = -1; s2.col = firstIsSmall ? BLUE : PINK; s2.pct = firstIsSmall ? large : small;
  s1.lodN = simplifyClosed(s1.pts, s1.n, GHOST_EPS, s1.lod);
  s2.lodN = simplifyClosed(s2.pts, s2.n, GHOST_EPS, s2.lod);
  PiecePhysics.spawn(s1, cutN);
  PiecePhysics.spawn(s2, cutN);
  PiecePhysics.count = 2;

  const scored = scoreFor(err);
  let grade;
  if (scored.perfect) grade = 'perfect';
  else if (err < SUCCESS_ERR) grade = 'success';
  else if (err <= ROUGH_ERR) grade = 'close';
  else grade = 'rough';

  totalScore += scored.pts;
  result = RESULT;
  result.small = small; result.large = large; result.err = err; result.grade = grade; result.pts = scored.pts;
  resultT = 0;
  state = 'cut';
  cutFlash = CUT_FLASH;
  cutFlash.a[0] = a[0]; cutFlash.a[1] = a[1];
  cutFlash.b[0] = b[0]; cutFlash.b[1] = b[1];
  cutFlash.t = 0;
  sfx.slice();

  const cn = chordPoints(WORLD, pn, a, b);
  sparks(CHORD, cn, 18, '#ffffff');

  const ptsLabel = grade === 'perfect'
    ? `+${fmt(scored.pts)} PERFECT BONUS!`
    : `+${fmt(scored.pts)} PTS`;
  const ptsPop = addPop(ptsLabel, CX, CY + L.pop * 0.92, grade === 'perfect' ? L.pop * 0.32 : L.pop * 0.46,
    grade === 'rough' ? '#ff2a2a' : GOLD, 1.4);
  ptsPop.pts = true;

  if (grade === 'perfect') {
    shake = 5; flash = 1; gold = 1; hitstop = 0.14;
    triggerGlitch();
    confetti(CHORD, cn, 170);
    addPop('PERFECT!', CX, CY - L.pop * 0.15, L.pop * 0.82, null, 1.35, true);
    sfx.perfect(); vibrate([30, 40, 60]);
  } else if (grade === 'success') {
    shake = 5; gold = 0.9;
    goldSplash(CHORD, cn, 55);
    addPop('SUCCESS', CX, CY - L.pop * 0.05, L.pop * 0.62, GOLD, 1.2);
    sfx.ding(); vibrate(20);
  } else if (grade === 'close') {
    shake = 3;
    sparks(CHORD, cn, 14, '#bbbbbb');
    sfx.close();
  } else {
    shake = 8;
    sparks(CHORD, cn, 28, '#ff2a2a');
    sfx.fail(); vibrate(40);
  }
}

const CHORD = pairBuffer(81);
function chordPoints(poly, pn, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
  const t0 = (CX - a[0]) * ux + (CY - a[1]) * uy;
  let m = 0;
  for (let i = 0; i <= 80; i++) {
    const t = t0 + (-1.1 + 2.2 * i / 80) * R;
    const x = a[0] + ux * t, y = a[1] + uy * t;
    if (inPoly(x, y, poly, pn)) { CHORD[m][0] = x; CHORD[m][1] = y; m++; }
  }
  if (!m) { CHORD[0][0] = CX; CHORD[0][1] = CY; m = 1; }
  return m;
}

// ---------- Particles & pops ----------
// Fixed pools with an active-count pointer. Dead entries are swapped past the pointer (order kept),
// so structs are recycled forever and nothing is handed to the GC.
const PARTICLE_CAP = 1024;
const particlePool = new Array(PARTICLE_CAP);
for (let i = 0; i < PARTICLE_CAP; i++) {
  particlePool[i] = { x: 0, y: 0, vx: 0, vy: 0, g: 0, fr: 0, life: 0, max: 1, size: 0,
    kind: 'dot', col: '#ffffff', hue: 0, rot: 0, vr: 0 };
}
let particleCount = 0;
function takeParticle() {
  return particleCount < PARTICLE_CAP ? particlePool[particleCount++] : null;
}
function confetti(pts, pn, n) {
  for (let i = 0; i < n; i++) {
    const p = takeParticle();
    if (!p) return;
    const q = pts[Math.floor(Math.random() * pn)], a = rand(0, Math.PI * 2), sp = rand(180, 720);
    p.x = q[0]; p.y = q[1]; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - 180;
    p.g = 750; p.fr = 0.25; p.life = rand(0.9, 1.7); p.max = 1.7; p.size = rand(5, 10);
    p.hue = rand(0, 360); p.rot = rand(0, 6.28); p.vr = rand(-14, 14); p.kind = 'rect';
  }
}
function goldSplash(pts, pn, n) {
  for (let i = 0; i < n; i++) {
    const p = takeParticle();
    if (!p) return;
    const q = pts[Math.floor(Math.random() * pn)], a = rand(0, Math.PI * 2), sp = rand(60, 340);
    p.x = q[0]; p.y = q[1]; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - 60;
    p.g = 320; p.fr = 0.3; p.life = rand(0.5, 1.0); p.max = 1.0; p.size = rand(1.5, 3.6); p.kind = 'dot';
    p.col = Math.random() < 0.8 ? GOLD : '#fff6c0';
  }
}
function sparks(pts, pn, n, col) {
  for (let i = 0; i < n; i++) {
    const p = takeParticle();
    if (!p) return;
    const q = pts[Math.floor(Math.random() * pn)], a = rand(0, Math.PI * 2), sp = rand(80, 300);
    p.x = q[0]; p.y = q[1]; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
    p.g = 150; p.fr = 0.15; p.life = rand(0.25, 0.55); p.max = 0.55; p.size = rand(1, 2.4); p.kind = 'dot';
    p.col = col;
  }
}

const POP_CAP = 16;
const popPool = new Array(POP_CAP);
for (let i = 0; i < POP_CAP; i++) {
  popPool[i] = { text: '', x: 0, y: 0, size: 0, color: null, dur: 1, rainbow: false, t: 0, pts: false };
}
const POP_SINK = { text: '', x: 0, y: 0, size: 0, color: null, dur: 1, rainbow: false, t: 0, pts: false };
let popCount = 0;
function addPop(text, x, y, size, color, dur, rainbow = false, delay = 0) {
  if (popCount >= POP_CAP) return POP_SINK;
  const p = popPool[popCount++];
  p.text = text; p.x = x; p.y = y; p.size = size; p.color = color; p.dur = dur;
  p.rainbow = rainbow; p.t = -delay; p.pts = false;
  return p;
}

// ---------- Piece physics ----------
// Velocities and gravity are per-frame at 60 fps; step() scales by dt so the fall is frame-rate independent.
// dt arrives already multiplied by the global time scale, so hit-stop slows motion, spin, fade and trail alike.
const PiecePhysics = {
  GRAVITY: 0.3,
  POP_MIN: 2, POP_MAX: 4,
  PUSH: 2.4,
  NUDGE: 6,
  SPIN: 0.012,
  TRAIL: 10,
  SAMPLE: 1 / 120,     // trail sample spacing in simulated seconds, independent of display refresh
  GHOST_STEP: 4,       // max px between drawn ghosts before interpolating
  GHOST_MAX: 36,       // per-piece ghost budget for mobile fill-rate
  GHOST_DECAY: 0.7,
  GHOST_ALPHA: 0.55,
  // Static piece slots; `count` is the active pointer. Trails are fixed-size ring buffers and
  // ghosts are written into one shared Float64Array, so the 1/120 s sampler never allocates.
  pool: null,
  count: 0,
  ghostBuf: null,
  _pa: new Float64Array(3),
  _pb: new Float64Array(3),
  makeSlot() {
    return {
      pts: pairBuffer(POLY_PREALLOC), n: 0, lod: pairBuffer(POLY_PREALLOC), lodN: 0,
      c: [0, 0], dir: 1, col: PINK, pct: 0,
      x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, alpha: 0,
      trail: new Float64Array(this.TRAIL * 3), tHead: 0, tCount: 0, acc: 0
    };
  },
  spawn(pc, n) {
    const push = this.PUSH * pc.dir;
    pc.x = pc.c[0] + n[0] * this.NUDGE * pc.dir;
    pc.y = pc.c[1] + n[1] * this.NUDGE * pc.dir;
    pc.vx = n[0] * push;
    pc.vy = n[1] * push - rand(this.POP_MIN, this.POP_MAX);
    pc.rot = 0;
    pc.vr = this.SPIN * pc.dir * rand(0.6, 1.4);
    pc.alpha = 1;
    pc.tHead = 0;
    pc.tCount = 0;
    pc.acc = 0;
    return pc;
  },
  step(dt, t) {
    if (dt <= 0) return;
    const f = dt * 60;
    const alpha = clamp(1 - t / RESULT_TIME, 0, 1);
    const T = this.TRAIL;
    for (let i = 0; i < this.count; i++) {
      const pc = this.pool[i];
      const x0 = pc.x, y0 = pc.y, r0 = pc.rot;
      pc.vy += this.GRAVITY * f;
      pc.x += pc.vx * f;
      pc.y += pc.vy * f;
      pc.rot += pc.vr * f;
      pc.alpha = alpha;
      // Emit samples at their exact sub-step instant so spacing tracks simulated time, not frame count.
      pc.acc += dt;
      const tr = pc.trail;
      while (pc.acc >= this.SAMPLE) {
        pc.acc -= this.SAMPLE;
        const k = 1 - pc.acc / dt;
        pc.tHead = (pc.tHead + 1) % T;
        const o = pc.tHead * 3;
        tr[o] = x0 + (pc.x - x0) * k;
        tr[o + 1] = y0 + (pc.y - y0) * k;
        tr[o + 2] = r0 + (pc.rot - r0) * k;
        if (pc.tCount < T) pc.tCount++;
      }
    }
  },
  // Path index 0 is the live piece; 1..tCount walk the ring buffer newest -> oldest.
  pathPoint(pc, j, out) {
    if (j === 0) { out[0] = pc.x; out[1] = pc.y; out[2] = pc.rot; return; }
    const o = ((pc.tHead - j + 1 + this.TRAIL) % this.TRAIL) * 3;
    out[0] = pc.trail[o]; out[1] = pc.trail[o + 1]; out[2] = pc.trail[o + 2];
  },
  // Walks head -> tail, lerping extra ghosts wherever consecutive points are far apart.
  // Fills ghostBuf with [x, y, rot, alpha] head-first and returns the count; draw it in reverse.
  ghosts(pc) {
    const len = 1 + pc.tCount;
    let a = this._pa, b = this._pb, sw;
    this.pathPoint(pc, 0, a);
    let total = 0;
    for (let i = 1; i < len; i++) {
      this.pathPoint(pc, i, b);
      total += Math.hypot(b[0] - a[0], b[1] - a[1]);
      sw = a; a = b; b = sw;
    }
    const step = Math.max(this.GHOST_STEP, total / this.GHOST_MAX);
    const g = this.ghostBuf, cap = g.length / 4;
    let m = 0;
    this.pathPoint(pc, 0, a);
    for (let i = 1; i < len; i++) {
      this.pathPoint(pc, i, b);
      const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
      const inv = 1 / Math.sqrt(n);
      for (let s = 1; s <= n && m < cap; s++) {
        const u = s / n, o = m * 4;
        g[o] = a[0] + (b[0] - a[0]) * u;
        g[o + 1] = a[1] + (b[1] - a[1]) * u;
        g[o + 2] = a[2] + (b[2] - a[2]) * u;
        g[o + 3] = pc.alpha * this.GHOST_ALPHA * Math.pow(this.GHOST_DECAY, i - 1 + u) * inv;
        m++;
      }
      sw = a; a = b; b = sw;
    }
    return m;
  },
  reset() { this.count = 0; }
};
PiecePhysics.pool = [PiecePhysics.makeSlot(), PiecePhysics.makeSlot()];
PiecePhysics.ghostBuf = new Float64Array((PiecePhysics.GHOST_MAX + PiecePhysics.TRAIL) * 2 * 4);

// ---------- Update ----------
function update(dt) {
  applyPendingInput();
  time += dt;
  if (shape && (state === 'aim' || state === 'menu')) shape.angle += shape.spin * dt;

  if (state === 'cut') {
    resultT += dt;
    PiecePhysics.step(dt, resultT);
    if (resultT >= RESULT_TIME) {
      if (round >= ROUNDS) finishGame();
      else nextRound();
    }
  } else if (state === 'over') {
    resultT += dt;
  }

  let w = 0;
  for (let i = 0; i < particleCount; i++) {
    const p = particlePool[i];
    const f = Math.pow(p.fr, dt);
    p.vx *= f; p.vy *= f;
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'rect') p.rot += p.vr * dt;
    p.life -= dt;
    if (p.life > 0) {
      if (i !== w) { particlePool[i] = particlePool[w]; particlePool[w] = p; }
      w++;
    }
  }
  particleCount = w;

  w = 0;
  for (let i = 0; i < popCount; i++) {
    const p = popPool[i];
    p.t += dt;
    if (p.t < p.dur) {
      if (i !== w) { popPool[i] = popPool[w]; popPool[w] = p; }
      w++;
    }
  }
  popCount = w;

  if (cutFlash) { cutFlash.t += dt; if (cutFlash.t > 0.4) cutFlash = null; }

  shake *= Math.exp(-dt * 9); if (shake < 0.1) shake = 0;
  flash *= Math.exp(-dt * 4.5);
  gold *= Math.exp(-dt * 2.4);
}

// ---------- Render ----------
function drawBackground() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, W, H);

  const g = Math.max(32, Math.min(W, H) / 11);
  const oy = (time * 12) % g;
  const ox = (W / 2) % g;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(176,38,255,0.13)';
  ctx.beginPath();
  for (let x = ox - g; x < W + g; x += g) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, H); }
  for (let y = oy - g; y < H + g; y += g) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0,240,255,0.06)';
  ctx.beginPath();
  for (let y = oy - g * 4; y < H + g; y += g * 4) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(W, Math.round(y) + 0.5); }
  ctx.stroke();

  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

function tracePoly(pts, n = pts.length) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function drawPoly(pts, col, alpha = 1, fillA = 0.2, n = pts.length) {
  if (n < 3 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineJoin = 'round';
  tracePoly(pts, n);
  ctx.fillStyle = hexA(col, fillA);
  ctx.fill();
  ctx.shadowColor = col; ctx.shadowBlur = 26;
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

function drawShape() {
  if (!shape) return;
  const n = worldPts(shape);
  const pulse = 0.18 + Math.sin(time * 3) * 0.04;
  drawPoly(WORLD, shape.color, state === 'menu' ? 0.55 : 1, pulse, n);
}

function placePiece(pc, x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.translate(-pc.c[0], -pc.c[1]);
}
// Ghosts skip shadowBlur; the wide low-alpha stroke fakes the glow so dense trails stay cheap.
function drawGhost(pc, col, x, y, rot, alpha) {
  if (alpha < 0.004) return;
  placePiece(pc, x, y, rot);
  tracePoly(pc.lod, pc.lodN);
  ctx.strokeStyle = col;
  ctx.globalAlpha = alpha * 0.35;
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();
}
function drawPieces() {
  const t = resultT;
  const rough = result && result.grade === 'rough';
  const PP = PiecePhysics, g = PP.ghostBuf;
  for (let i = 0; i < PP.count; i++) {
    const pc = PP.pool[i];
    if (pc.alpha <= 0) continue;
    const col = rough && Math.floor(t * 8) % 2 === 0 ? '#ff2a2a' : pc.col;
    ctx.save();
    ctx.lineJoin = 'round';
    for (let j = PP.ghosts(pc) - 1; j >= 0; j--) {
      const o = j * 4;
      drawGhost(pc, col, g[o], g[o + 1], g[o + 2], g[o + 3]);
    }
    ctx.restore();
    placePiece(pc, pc.x, pc.y, pc.rot);
    drawPoly(pc.pts, col, pc.alpha, 0.26, pc.n);
    ctx.globalAlpha = pc.alpha * clamp(t / 0.2, 0, 1);
    ctx.font = `700 ${Math.max(11, R * 0.085)}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = pc.col; ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.fillText(pc.pct.toFixed(2), pc.c[0], pc.c[1]);
    ctx.restore();
  }
}

function drawLaser(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (len < 2) return;
  const ux = dx / len, uy = dy / len, ext = Math.max(W, H) * 2;
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.setLineDash([6, 10]);
  ctx.lineDashOffset = -time * 40;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(a[0] - ux * ext, a[1] - uy * ext); ctx.lineTo(b[0] + ux * ext, b[1] + uy * ext); ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalAlpha = 1;
  ctx.lineCap = 'round';
  const flicker = 0.85 + Math.random() * 0.15;
  ctx.shadowColor = LASER; ctx.shadowBlur = 28;
  ctx.strokeStyle = hexA(LASER, 0.55 * flicker); ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(a[0], a[1], 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = LASER; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(b[0], b[1], 5 + Math.sin(time * 30) * 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawCutFlash() {
  if (!cutFlash) return;
  const { a, b, t } = cutFlash;
  const k = 1 - t / 0.4;
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len, ext = Math.max(W, H) * 2;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.lineCap = 'round';
  ctx.shadowColor = LASER; ctx.shadowBlur = 30;
  ctx.strokeStyle = hexA(LASER, 0.7); ctx.lineWidth = 10 * k + 1;
  ctx.beginPath(); ctx.moveTo(a[0] - ux * ext, a[1] - uy * ext); ctx.lineTo(b[0] + ux * ext, b[1] + uy * ext); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5 * k + 0.5;
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particleCount; i++) {
    const p = particlePool[i];
    const a = clamp(p.life / p.max * 1.6, 0, 1);
    ctx.globalAlpha = a;
    if (p.kind === 'rect') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = `hsl(${(p.hue + time * 200) % 360},100%,60%)`;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    } else {
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawPops() {
  for (let i = 0; i < popCount; i++) {
    const p = popPool[i];
    if (p.t < 0) continue;
    const k = p.t / p.dur;
    const s = p.t < 0.22 ? easeOutBack(p.t / 0.22) : 1 + (p.t - 0.22) * 0.06;
    const a = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    ctx.save();
    ctx.translate(p.x, p.y - k * 18);
    ctx.rotate(p.rainbow ? Math.sin(p.t * 20) * 0.03 * (1 - k) : 0);
    ctx.scale(s, s);
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = `900 ${p.size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (p.rainbow) {
      const w = ctx.measureText(p.text).width;
      const grad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      for (let i = 0; i <= 6; i++) grad.addColorStop(i / 6, `hsl(${(time * 360 + i * 60) % 360},100%,62%)`);
      ctx.lineWidth = Math.max(2, p.size * 0.06);
      ctx.strokeStyle = '#fff';
      ctx.shadowColor = `hsl(${(time * 360) % 360},100%,60%)`; ctx.shadowBlur = 30;
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = grad;
      ctx.fillText(p.text, 0, 0);
    } else {
      ctx.shadowColor = p.color; ctx.shadowBlur = 22;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, 0, 0);
      ctx.shadowBlur = 0;
      ctx.globalAlpha *= 0.6;
      ctx.fillStyle = '#fff';
      ctx.fillText(p.text, 0, 0);
    }
    ctx.restore();
  }
}

function text(str, x, y, size, color, opt = {}) {
  const { align = 'center', weight = 700, glow = 12, alpha = 1, spacing = 0 } = opt;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function drawRatio(a, b, y, size, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const sep = ' : ';
  const wa = ctx.measureText(a).width, ws = ctx.measureText(sep).width, wb = ctx.measureText(b).width;
  let x = W / 2 - (wa + ws + wb) / 2;
  x = ratioPart(a, PINK, x, y, size, wa);
  x = ratioPart(sep, '#ffffff', x, y, size, ws);
  ratioPart(b, BLUE, x, y, size, wb);
  ctx.restore();
}
function ratioPart(s, c, x, y, size, w) {
  ctx.shadowColor = c; ctx.shadowBlur = size * 0.45;
  ctx.fillStyle = c;
  ctx.fillText(s, x, y);
  return x + w;
}
const GRADE_COL = { perfect: '#ffffff', success: GOLD, close: '#bbbbbb', rough: '#ff2a2a' };

function drawHUD() {
  if (state === 'menu' || state === 'over') return;
  const padR = Math.max(18, W * 0.04, SAFE.right + 12);

  text('SCORE', chrome.scoreX, chrome.scoreLabel, 10, '#ffffff', { align: 'left', alpha: 0.5, glow: 0, spacing: 3 });
  let bump = 1;
  for (let i = 0; i < popCount; i++) {
    const p = popPool[i];
    if (p.pts && p.t >= 0 && p.t < 0.28) { bump = 1.18; break; }
  }
  text(fmt(totalScore), chrome.scoreX, chrome.scoreValue, 26 * bump, '#ffffff', { align: 'left', weight: 900, glow: 16 });

  text('ROUND', W - padR, chrome.roundLabel, 10, '#ffffff', { align: 'right', alpha: 0.5, glow: 0, spacing: 3 });
  text(`${round} / ${ROUNDS}`, W - padR, chrome.roundValue, 22, BLUE, { align: 'right', weight: 900, glow: 14 });

  text('TARGET', W / 2, L.tLabelY, 11, '#ffffff', { alpha: 0.55, glow: 0, spacing: 6 });
  const t = String(target), o = String(100 - target);
  drawRatio(t, o, L.tY, L.s);

  if (result && (state === 'cut' || state === 'over')) {
    const k = clamp(resultT / 0.18, 0, 1);
    drawRatio(result.small.toFixed(2), result.large.toFixed(2), L.rY, L.rSize, k);
    const gc = GRADE_COL[result.grade];
    text(`Δ ${result.err.toFixed(2)}%`, W / 2, L.eY, Math.max(11, L.rSize * 0.55), gc,
      { alpha: k, glow: 10, spacing: 2 });
  }

  if (state === 'aim' && round === 1 && totalScore === 0 && !drag) {
    const a = 0.35 + Math.sin(time * 4) * 0.25;
    text('DRAG TO SLICE', W / 2, H - Math.max(22, H * 0.035, SAFE.bottom + 16), 11, '#ffffff', { alpha: a, glow: 8, spacing: 5 });
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();

  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  if (gold > 0.01) {
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 1.7);
    g.addColorStop(0, `rgba(255,215,0,${0.32 * gold})`);
    g.addColorStop(0.5, `rgba(255,170,0,${0.12 * gold})`);
    g.addColorStop(1, 'rgba(255,170,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'aim' || state === 'menu') drawShape();
  else drawPieces();

  drawCutFlash();
  if (drag) drawLaser(drag.a, drag.b);
  drawParticles();
  drawPops();
  ctx.restore();

  drawHUD();

  if (flash > 0.01) {
    ctx.fillStyle = `hsla(${(time * 720) % 360},100%,60%,${flash * 0.3})`;
    ctx.fillRect(0, 0, W, H);
    if (flash > 0.75) {
      ctx.fillStyle = `rgba(255,255,255,${(flash - 0.75) * 1.6})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
  paintGlitch();
}

function paintGlitch() {
  if (glitchT <= 0) return;
  const sw = cvs.width, sh = cvs.height;
  if (!sw || !sh) return;
  if (scratch.width !== sw || scratch.height !== sh) {
    scratch.width = sw;
    scratch.height = sh;
  }
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.drawImage(cvs, 0, 0);
  const shift = 5 * DPR;
  const fringe = 3 * DPR;
  const bands = [
    { y: sh * 0.38, h: 6 * DPR, dx: -shift },
    { y: sh * 0.52, h: 4 * DPR, dx: shift },
    { y: sh * 0.61, h: 5 * DPR, dx: -shift * 0.6 }
  ];
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const b of bands) {
    const y = Math.max(0, Math.floor(b.y));
    const hh = Math.min(Math.max(1, Math.floor(b.h)), sh - y);
    if (hh <= 0) continue;
    const dx = Math.round(Math.max(-shift, Math.min(shift, b.dx)));
    ctx.drawImage(scratch, 0, y, sw, hh, dx, y, sw, hh);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.28;
    ctx.drawImage(scratch, 0, y, sw, hh, dx - fringe, y, sw, hh);
    ctx.drawImage(scratch, 0, y, sw, hh, dx + fringe, y, sw, hh);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

// ---------- Loop ----------
const HITSTOP_SCALE = 0.12;
let last = performance.now();
function frame(now) {
  const wall = Math.min(0.05, (now - last) / 1000);
  last = now;
  // Only the slice of this frame that overlaps the hit-stop runs slowed, so the exit is seamless.
  const slow = Math.min(wall, Math.max(0, hitstop));
  hitstop -= slow;
  const dt = slow * HITSTOP_SCALE + (wall - slow);
  if (glitchT > 0) glitchT = Math.max(0, glitchT - wall);
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend();
  else { applyMasterVolume(); AC.resume(); }
});
})();
</script>
</body>
